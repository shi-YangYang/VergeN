location ~ "^/sub/(?<ios_key>[0-9a-f]{64})/clash\.yaml$" {
    open_file_cache off;
    if (!-f /var/lib/vergen-ios-pool/assigned/$ios_key) { return 404; }
    root /var/lib/jiakuan-sub;
    try_files /clash.yaml =404;
    default_type application/yaml;
    add_header Content-Disposition 'attachment; filename="jiakuan-clash.yaml"';
    add_header Cache-Control 'private, no-store' always;
    add_header profile-update-interval '24';
    limit_except GET { deny all; }
}
