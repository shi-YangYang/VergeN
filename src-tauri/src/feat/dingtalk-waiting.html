<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
    <title>VergeN - DingTalk</title>
    <style>
      body { margin: 0; padding: 48px 24px; font: 16px/1.8 system-ui, sans-serif; color: #202124; background: #fff; }
      main { max-width: 520px; margin: 12vh auto 0; }
      h1 { font-size: 24px; }
      p { color: #5f6368; }
      a { display: inline-block; padding: 10px 24px; border-radius: 8px; color: #fff; background: #067aff; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>请在钉钉中完成登录授权</h1>
      <p>正在尝试打开本地钉钉。授权完成后，VergeN 会自动登录。</p>
      <p>如果钉钉没有打开，或你想使用其他账号，可以继续使用网页登录。</p>
      <a href="{{LOGIN_URL}}">使用网页登录</a>
    </main>
  </body>
</html>
