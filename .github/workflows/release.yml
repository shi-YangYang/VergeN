name: Release

on:
  push:
    tags:
      - "v*"
  # Manual CD: run from Actions against the main branch and give the
  # release tag; a tag push of the same shape does the same thing.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  client:
    name: Client ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - label: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - label: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # Baked into the client at build time; set it in repo variables.
      VITE_ENTERPRISE_SERVER_URL: ${{ vars.VITE_ENTERPRISE_SERVER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: Install desktop dependencies (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the admin panel
        run: pnpm build --prefix server/web
      - name: Fetch mihomo sidecars and service release
        run: pnpm prebuild ${{ matrix.target }}
      - name: Build and publish the desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: VergeN ${{ env.RELEASE_TAG }}
          releaseBody: "See the assets to download and install this version."
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

  android:
    name: Android client
    runs-on: ubuntu-24.04
    env:
      JAVA_HOME: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk_21_latest_x64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-go@v5
        with:
          go-version-file: android/core/src/foss/golang/clash/go.mod
      - name: Install Android SDK pieces
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1" >/dev/null
      # remove.suffix keeps the applicationId a bare io.github.vergen.android
      # so upgrades install over the same package instead of a .alpha twin.
      - name: Configure the flavor identity
        working-directory: android
        run: printf 'sdk.dir=%s\nremove.suffix=true\n' \
          "$ANDROID_HOME" > local.properties
      - name: Wire signing config
        working-directory: android
        env:
          VERGEN_STORE_PASSWORD: ${{ secrets.ANDROID_SIGN_STORE_PASSWORD }}
          VERGEN_KEY_PASSWORD: ${{ secrets.ANDROID_SIGN_KEY_PASSWORD }}
        run: |
          # The repo carries a dev keystore; production overrides via secrets.
          store="${VERGEN_STORE_PASSWORD:-vergen1234}"
          printf 'keystore.password=%s\nkey.alias=vergen\nkey.password=%s\n' \
            "$store" "${VERGEN_KEY_PASSWORD:-$store}" > signing.properties
      - name: Build the Android client
        working-directory: android
        run: JAVA_HOME=$JAVA_HOME ./gradlew :app:assembleAlphaRelease --no-daemon --console=plain
      - name: Rename artifacts
        working-directory: android/app/build/outputs/apk/alpha/release
        run: |
          mkdir -p ../upload
          for arch in arm64-v8a armeabi-v7a x86 x86_64 universal; do
            src="cmfa-${RELEASE_TAG#v}-alpha-${arch}-release.apk"
            [ -f "$src" ] && cp "$src" "../upload/vergen-${RELEASE_TAG#v}-android-$arch.apk"
          done
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" \
            android/app/build/outputs/apk/alpha/release/upload/*.apk \
            --clobber --repo "$GITHUB_REPOSITORY"

  server:
    name: Server ${{ matrix.label }}
    needs: client
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-amd64
            goos: linux
            goarch: amd64
          - label: linux-arm64
            goos: linux
            goarch: arm64
          - label: darwin-amd64
            goos: darwin
            goarch: amd64
          - label: darwin-arm64
            goos: darwin
            goarch: arm64
          - label: windows-amd64
            goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: Build the vergen server
        working-directory: server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        shell: bash
        run: |
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          output="vergen-server-${GOOS}-${GOARCH}${ext}"
          go build -trimpath -ldflags "-s -w" -o "$output" ./cmd/server
          echo "output=$output" >> "$GITHUB_ENV"
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" "$output" --clobber --repo "$GITHUB_REPOSITORY"

  deploy:
    name: Deploy ops server
    # Installs/restarts vergen-server (admin panel embeds in it) on the
    # target host; the SQLite db on the host survives binary replacements.
    # Required configuration: secrets DEPLOY_HOST / DEPLOY_USER /
    # DEPLOY_SSH_KEY, optional secrets DEPLOY_PORT (service port, default
    # 8080) and DEPLOY_SSH_PORT, optional var DEPLOY_ARCH (default amd64).
    needs: [client, server]
    runs-on: ubuntu-latest
    steps:
      - name: Skip when deployment is not configured
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::notice::DEPLOY_HOST/DEPLOY_USER/DEPLOY_SSH_KEY not set; skipping server deploy."
            echo "SKIP_DEPLOY=1" >> "$GITHUB_ENV"
          fi
      - name: Prepare ssh config
        if: env.SKIP_DEPLOY != '1'
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/vergen_deploy_key
          chmod 600 ~/.ssh/vergen_deploy_key
          {
            echo "Host vergen-target"
            echo "  HostName $DEPLOY_HOST"
            echo "  User $DEPLOY_USER"
            echo "  Port ${DEPLOY_SSH_PORT:-22}"
            echo "  IdentityFile ~/.ssh/vergen_deploy_key"
            echo "  StrictHostKeyChecking accept-new"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config
      - name: Download the server binary asset
        if: env.SKIP_DEPLOY != '1'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_ARCH: ${{ vars.DEPLOY_ARCH }}
        run: |
          ARCH="${DEPLOY_ARCH:-amd64}"
          gh release download "$RELEASE_TAG" \
            --pattern "vergen-server-linux-$ARCH" --dir . --repo "$GITHUB_REPOSITORY"
          mv "vergen-server-linux-$ARCH" vergen-server
          chmod +x vergen-server
      - name: Render the systemd unit
        if: env.SKIP_DEPLOY != '1'
        shell: bash
        env:
          DEPLOY_SERVICE_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          port="${DEPLOY_SERVICE_PORT:-8080}"
          # Loopback bind only: caddy on the host terminates TLS for the
          # public 443 and proxies into 127.0.0.1:$port.
          cat > /tmp/vergen-server.service <<UNIT
          [Unit]
          Description=VergeN ops server
          After=network.target caddy.service

          [Service]
          User=vergen
          ExecStart=/usr/local/bin/vergen-server --db /var/lib/vergen/vergen.db --addr 127.0.0.1:$port
          Restart=always
          RestartSec=3
          NoNewPrivileges=true
          ProtectSystem=full
          ProtectHome=true
          PrivateTmp=true

          [Install]
          WantedBy=multi-user.target
          UNIT
      - name: Ship and restart
        if: env.SKIP_DEPLOY != '1'
        shell: bash
        run: |
          scp vergen-server vergen-target:/tmp/vergen-server.new
          scp /tmp/vergen-server.service vergen-target:/tmp/vergen-server.service
          ssh vergen-target <<'REMOTE'
          set -e
          id vergen >/dev/null 2>&1 || sudo useradd -r -s /usr/sbin/nologin vergen
          sudo mv /tmp/vergen-server.new /usr/local/bin/vergen-server
          sudo chmod 755 /usr/local/bin/vergen-server
          sudo mkdir -p /var/lib/vergen
          sudo chown -R vergen:vergen /var/lib/vergen
          sudo mv /tmp/vergen-server.service /etc/systemd/system/vergen-server.service
          sudo systemctl daemon-reload
          sudo systemctl enable vergen-server
          sudo systemctl restart vergen-server
          REMOTE
      - name: Health check
        if: env.SKIP_DEPLOY != '1'
        shell: bash
        env:
          DEPLOY_SERVICE_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          port="${DEPLOY_SERVICE_PORT:-8080}"
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 5 "http://$DEPLOY_HOST:$port/healthz" | grep -q ok; then
              echo "deploy health check ok"
              exit 0
            fi
            sleep 5
          done
          echo "::error::health check failed after deploy"
          exit 1
