name: Release

on:
  # Manual CD only: run from the Actions tab against the main branch and
  # provide the release tag. Pushing a tag does NOT start this pipeline.
  workflow_dispatch:
    inputs:
      tag:
        description: "Client version, e.g. v0.1.1"
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  client:
    name: Client ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - label: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - label: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    env:
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_STRIP: debuginfo
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # Baked into the client at build time; set it in repo variables.
      VITE_ENTERPRISE_SERVER_URL: ${{ vars.VITE_ENTERPRISE_SERVER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install desktop dependencies (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ hashFiles('Cargo.toml') }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Set the client version
        shell: bash
        run: pnpm release-version "$RELEASE_TAG"
      - name: Fetch mihomo sidecars and service release
        run: pnpm prebuild ${{ matrix.target }}
      - name: Build the desktop app
        id: desktop
        uses: tauri-apps/tauri-action@v0
        with:
          args: --target ${{ matrix.target }}
      - name: Collect desktop packages
        env:
          ARTIFACT_PATHS: ${{ steps.desktop.outputs.artifactPaths }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const installer = /\.(exe|msi|dmg|pkg|deb|rpm|AppImage)$/i;
          fs.mkdirSync('client-artifacts');
          fs.mkdirSync('updater-artifacts');
          for (const file of JSON.parse(process.env.ARTIFACT_PATHS)) {
            if (fs.statSync(file, { throwIfNoEntry: false })?.isFile()) {
              const directory = installer.test(file) ? 'client-artifacts' : 'updater-artifacts';
              fs.copyFileSync(file, path.join(directory, path.basename(file)));
            }
          }
          if (fs.readdirSync('client-artifacts').length === 0) {
            throw new Error('No desktop installer was produced');
          }
          NODE
      - name: Store desktop packages for deployment
        uses: actions/upload-artifact@v4
        with:
          name: client-${{ matrix.label }}
          path: client-artifacts/
          if-no-files-found: error
          compression-level: 0
      - name: Store updater files for manual release management
        uses: actions/upload-artifact@v4
        with:
          name: updater-${{ matrix.label }}
          path: updater-artifacts/
          if-no-files-found: ignore
          compression-level: 0

  android:
    name: Android client
    runs-on: ubuntu-24.04
    env:
      JAVA_HOME: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk_21_latest_x64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-go@v5
        with:
          go-version-file: android/core/src/foss/golang/clash/go.mod
      - name: Install Android SDK pieces
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1" >/dev/null
      # remove.suffix keeps the applicationId a bare io.github.vergen.android
      # so upgrades install over the same package instead of a .alpha twin.
      - name: Configure the flavor identity
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: printf 'sdk.dir=%s\nremove.suffix=true\n' \
          "$ANDROID_HOME" > local.properties
      - name: Wire signing config
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          VERGEN_STORE_PASSWORD: ${{ secrets.ANDROID_SIGN_STORE_PASSWORD }}
          VERGEN_KEY_PASSWORD: ${{ secrets.ANDROID_SIGN_KEY_PASSWORD }}
        run: |
          if [[ -n "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "Decoded the production keystore from ANDROID_KEYSTORE_BASE64"
          else
            # No production keystore yet: remove the stale local file so the
            # build falls back to the debug signing config instead of failing.
            rm -f release.keystore signing.properties.bak
            echo "ANDROID_KEYSTORE_BASE64 not set; falling back to debug signing"
          fi
          # The repo carries a dev keystore; production overrides via secrets.
          store="${VERGEN_STORE_PASSWORD:-vergen1234}"
          printf 'keystore.password=%s\nkey.alias=vergen\nkey.password=%s\n' \
            "$store" "${VERGEN_KEY_PASSWORD:-$store}" > signing.properties
      - name: Build the Android client
        working-directory: android
        run: |
          ./gradlew :app:assembleAlphaRelease --no-daemon --console=plain \
            -PvergenVersionName="${RELEASE_TAG#v}" \
            -PvergenVersionCode="$GITHUB_RUN_NUMBER"
      - name: Prepare the Android package
        working-directory: android/app/build/outputs/apk/alpha/release
        run: |
          mkdir -p ../upload
          src=$(find . -maxdepth 1 -name '*-arm64-v8a-release.apk' -print -quit)
          if [ -z "$src" ]; then
            echo "::error::no arm64-v8a APK was produced"
            exit 1
          fi
          cp "$src" "../upload/vergen-${RELEASE_TAG#v}-android-arm64-v8a.apk"
      - name: Store the Android package for deployment
        uses: actions/upload-artifact@v4
        with:
          name: client-android
          path: android/app/build/outputs/apk/alpha/upload/*-android-arm64-v8a.apk
          if-no-files-found: error
          compression-level: 0

  server:
    name: Server linux-amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          prefix: server/web
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: server/web/pnpm-lock.yaml
      # The server embeds the admin panel with go:embed all:dist; the
      # panel must be built before any go build.
      - name: Build the admin panel
        working-directory: server/web
        run: pnpm install --frozen-lockfile && pnpm build
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: Build the vergen server
        working-directory: server
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        shell: bash
        run: go build -trimpath -buildvcs=false -ldflags "-s -w" -o vergen-server-linux-amd64 ./cmd/server
      - name: Store the server binary for deployment
        uses: actions/upload-artifact@v4
        with:
          name: server-linux-amd64
          path: server/vergen-server-linux-amd64
          if-no-files-found: error

  deploy:
    name: Deploy ops server
    # Installs/restarts vergen-server (admin panel embeds in it) on the
    # target host; the SQLite db on the host survives binary replacements.
    # Required configuration: secrets DEPLOY_HOST / DEPLOY_USER /
    # DEPLOY_SSH_KEY, optional secrets DEPLOY_PORT (service port, default
    # 8080) and DEPLOY_SSH_PORT.
    needs: [client, android, server]
    runs-on: ubuntu-latest
    steps:
      - name: Skip when deployment is not configured
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::notice::DEPLOY_HOST/DEPLOY_USER/DEPLOY_SSH_KEY not set; skipping server deploy."
            echo "SKIP_DEPLOY=1" >> "$GITHUB_ENV"
          fi
      - name: Prepare ssh config
        if: env.SKIP_DEPLOY != '1'
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/vergen_deploy_key
          chmod 600 ~/.ssh/vergen_deploy_key
          {
            echo "Host vergen-target"
            echo "  HostName $DEPLOY_HOST"
            echo "  User $DEPLOY_USER"
            echo "  Port ${DEPLOY_SSH_PORT:-22}"
            echo "  IdentityFile ~/.ssh/vergen_deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking accept-new"
            echo "  BatchMode yes"
            echo "  ConnectTimeout 15"
            echo "  ServerAliveInterval 15"
            echo "  ServerAliveCountMax 3"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config
      - name: Check deployment connection
        if: env.SKIP_DEPLOY != '1'
        timeout-minutes: 1
        shell: bash
        run: |
          timeout --kill-after=5s 45s ssh -n -v -T vergen-target \
            'printf "%s\n" vergen-deploy-ssh-ok' | grep -Fx vergen-deploy-ssh-ok
      - name: Download the server binary
        if: env.SKIP_DEPLOY != '1'
        uses: actions/download-artifact@v4
        with:
          name: server-linux-amd64
          path: server-artifacts/
      - name: Download client packages
        if: env.SKIP_DEPLOY != '1'
        uses: actions/download-artifact@v4
        with:
          pattern: client-*
          merge-multiple: true
          path: client-artifacts/
      - name: Prepare the server binary
        if: env.SKIP_DEPLOY != '1'
        shell: bash
        run: |
          mv server-artifacts/vergen-server-linux-amd64 vergen-server
          chmod +x vergen-server
      - name: Render the systemd unit
        if: env.SKIP_DEPLOY != '1'
        shell: bash
        env:
          DEPLOY_SERVICE_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          port="${DEPLOY_SERVICE_PORT:-8080}"
          # Loopback bind only: caddy on the host terminates TLS for the
          # public 443 and proxies into 127.0.0.1:$port.
          cat > /tmp/vergen-server.service <<UNIT
          [Unit]
          Description=VergeN ops server
          After=network.target caddy.service

          [Service]
          User=vergen
          ExecStart=/usr/local/bin/vergen-server --db /var/lib/vergen/vergen.db --addr 127.0.0.1:$port --downloads /var/lib/vergen/downloads
          Restart=always
          RestartSec=3
          NoNewPrivileges=true
          ProtectSystem=full
          ProtectHome=true
          PrivateTmp=true

          [Install]
          WantedBy=multi-user.target
          UNIT
      - name: Upload server files
        if: env.SKIP_DEPLOY != '1'
        timeout-minutes: 10
        shell: bash
        run: |
          set -x
          ls -lh vergen-server /tmp/vergen-server.service
          local_hash=$(sha256sum vergen-server | cut -d ' ' -f 1)
          remote_hash=$(ssh -T vergen-target 'if [ -f /usr/local/bin/vergen-server ]; then sha256sum /usr/local/bin/vergen-server; fi' | cut -d ' ' -f 1)
          if [ "$local_hash" = "$remote_hash" ]; then
            echo "Server binary unchanged; skipping upload"
            echo "SERVER_BINARY_CHANGED=false" >> "$GITHUB_ENV"
          else
            # scp hides its progress meter without a local terminal in Actions.
            script -q -e -c 'scp -v -C vergen-server vergen-target:/tmp/vergen-server.new' /dev/null </dev/null
            echo "SERVER_BINARY_CHANGED=true" >> "$GITHUB_ENV"
          fi
          script -q -e -c 'scp -v /tmp/vergen-server.service vergen-target:/tmp/vergen-server.service' /dev/null </dev/null
      - name: Restart ops server
        if: env.SKIP_DEPLOY != '1'
        timeout-minutes: 3
        shell: bash
        run: |
          ssh -T vergen-target "bash -se -- '$SERVER_BINARY_CHANGED'" <<'REMOTE'
          set -x
          id vergen >/dev/null 2>&1 || sudo -n useradd -r -s /usr/sbin/nologin vergen
          if [ "$1" = true ]; then
            sudo -n mv /tmp/vergen-server.new /usr/local/bin/vergen-server
            sudo -n chmod 755 /usr/local/bin/vergen-server
          fi
          sudo -n mkdir -p /var/lib/vergen
          sudo -n chown vergen:vergen /var/lib/vergen
          for file in /var/lib/vergen/vergen.db{,-wal,-shm}; do
            if [ -e "$file" ]; then
              sudo -n chown vergen:vergen "$file"
            fi
          done
          sudo -n mv /tmp/vergen-server.service /etc/systemd/system/vergen-server.service
          sudo -n systemctl daemon-reload
          sudo -n systemctl enable vergen-server
          sudo -n systemctl restart vergen-server
          REMOTE
      - name: Health check
        if: env.SKIP_DEPLOY != '1'
        timeout-minutes: 5
        shell: bash
        env:
          DEPLOY_SERVICE_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          port="${DEPLOY_SERVICE_PORT:-8080}"
          ssh -T vergen-target "bash -se -- '$port'" <<'REMOTE'
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 5 "http://127.0.0.1:$1/healthz" | grep -q ok; then
              echo "deploy health check ok"
              exit 0
            fi
            sleep 5
          done
          echo "::error::health check failed after deploy"
          exit 1
          REMOTE
      - name: Publish client downloads
        if: env.SKIP_DEPLOY != '1'
        timeout-minutes: 60
        shell: bash
        run: |
          set -x
          export LC_ALL=C
          du -ch client-artifacts/*
          batch_hash=$(sha256sum client-artifacts/* | sha256sum | cut -d ' ' -f 1)
          staging="/tmp/vergen-client-upload-${GITHUB_RUN_ID}-${batch_hash}"
          ssh -T vergen-target "bash -se -- '$staging'" <<'REMOTE'
          mkdir -p "$1"
          REMOTE
          upload_package() {
            local file=$1 local_hash=$2 remote_name state upload_command started elapsed bytes
            printf -v remote_name '%q' "$(basename "$file")"
            state=$(ssh -T vergen-target "bash -se -- '$staging' $remote_name '$local_hash'" <<'REMOTE'
          if [ -f "/var/lib/vergen/downloads/$2" ]; then
            checksum=$(sha256sum "/var/lib/vergen/downloads/$2")
            if [ "${checksum%% *}" = "$3" ]; then
              rm -f "$1/$2"
              echo published
              exit 0
            fi
          fi
          if [ -f "$1/$2" ]; then
            checksum=$(sha256sum "$1/$2")
            if [ "${checksum%% *}" = "$3" ]; then
              echo staged
              exit 0
            fi
          fi
          echo upload
          REMOTE
            )
            case "$state" in
              published) echo "Package unchanged; skipping upload: $file"; return ;;
              staged) echo "Reusing completed upload: $file"; return ;;
              upload) ;;
              *) echo "::error::Unexpected upload state for $file: $state"; return 1 ;;
            esac
            started=$SECONDS
            printf -v upload_command 'scp -v %q %q' "$file" "vergen-target:$staging/"
            script -q -e -c "$upload_command" /dev/null </dev/null
            elapsed=$((SECONDS - started))
            if [ "$elapsed" -eq 0 ]; then elapsed=1; fi
            bytes=$(stat -c %s "$file")
            echo "Uploaded $file: $bytes bytes in ${elapsed}s ($((bytes / elapsed / 1024)) KiB/s)"
          }
          wait_for_uploads() {
            local pid result=0
            for pid in "$@"; do
              wait "$pid" || result=1
            done
            return "$result"
          }
          max_parallel=2
          pids=()
          publish_args=
          for file in client-artifacts/*; do
            local_hash=$(sha256sum "$file" | cut -d ' ' -f 1)
            printf -v file_args ' %q %q' "$(basename "$file")" "$local_hash"
            publish_args+="$file_args"
            upload_package "$file" "$local_hash" &
            pids+=("$!")
            if [ "${#pids[@]}" -eq "$max_parallel" ]; then
              wait_for_uploads "${pids[@]}"
              pids=()
            fi
          done
          wait_for_uploads "${pids[@]}"
          ssh -T vergen-target "bash -se -- '$staging'$publish_args" <<'REMOTE'
          set -x
          staging=$1
          shift
          files=()
          while [ "$#" -gt 0 ]; do
            name=$1
            expected=$2
            shift 2
            file="$staging/$name"
            if [ -f "$file" ]; then
              files+=("$file")
            else
              file="/var/lib/vergen/downloads/$name"
            fi
            checksum=$(sha256sum "$file")
            if [ "${checksum%% *}" != "$expected" ]; then
              echo "::error::Package checksum mismatch: $name"
              exit 1
            fi
          done
          sudo -n mkdir -p /var/lib/vergen/downloads
          sudo -n chmod 755 /var/lib/vergen/downloads
          for file in "${files[@]}"; do
            sudo -n chmod 644 "$file"
            sudo -n chown vergen:vergen "$file"
            sudo -n mv -f "$file" /var/lib/vergen/downloads/
          done
          rmdir "$staging"
          REMOTE
