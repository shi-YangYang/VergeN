name: Release

on:
  # Manual server deployment only; client packaging runs separately.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    name: Server linux-amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: server/web/pnpm-lock.yaml
      # The server embeds the admin panel with go:embed all:dist; the
      # panel must be built before any go build.
      - name: Build the admin panel
        working-directory: server/web
        run: pnpm install --frozen-lockfile && pnpm build
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Build the vergen server
        working-directory: server
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        shell: bash
        run: go build -trimpath -buildvcs=false -ldflags "-s -w" -o vergen-server-linux-amd64 ./cmd/server
      - name: Store the server binary for deployment
        uses: actions/upload-artifact@v4
        with:
          name: server-linux-amd64
          path: server/vergen-server-linux-amd64
          if-no-files-found: error

  deploy:
    name: Deploy ops server
    # Installs/restarts vergen-server (admin panel embeds in it) on the
    # target host; the SQLite db on the host survives binary replacements.
    # Required configuration: secrets DEPLOY_HOST / DEPLOY_USER /
    # DEPLOY_SSH_KEY, optional secrets DEPLOY_PORT (service port, default
    # 8080) and DEPLOY_SSH_PORT.
    needs: server
    runs-on: ubuntu-latest
    steps:
      - name: Skip when deployment is not configured
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::notice::DEPLOY_HOST/DEPLOY_USER/DEPLOY_SSH_KEY not set; skipping server deploy."
            echo "SKIP_DEPLOY=1" >> "$GITHUB_ENV"
          fi
      - name: Prepare ssh config
        if: env.SKIP_DEPLOY != '1'
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/vergen_deploy_key
          chmod 600 ~/.ssh/vergen_deploy_key
          {
            echo "Host vergen-target"
            echo "  HostName $DEPLOY_HOST"
            echo "  User $DEPLOY_USER"
            echo "  Port ${DEPLOY_SSH_PORT:-22}"
            echo "  IdentityFile ~/.ssh/vergen_deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking accept-new"
            echo "  BatchMode yes"
            echo "  ConnectTimeout 15"
            echo "  ServerAliveInterval 15"
            echo "  ServerAliveCountMax 3"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config
      - name: Check deployment connection
        if: env.SKIP_DEPLOY != '1'
        timeout-minutes: 1
        shell: bash
        run: |
          timeout --kill-after=5s 45s ssh -n -v -T vergen-target \
            'printf "%s\n" vergen-deploy-ssh-ok' | grep -Fx vergen-deploy-ssh-ok
      - name: Download the server binary
        if: env.SKIP_DEPLOY != '1'
        uses: actions/download-artifact@v4
        with:
          name: server-linux-amd64
          path: server-artifacts/
      - name: Prepare the server binary
        if: env.SKIP_DEPLOY != '1'
        shell: bash
        run: |
          mv server-artifacts/vergen-server-linux-amd64 vergen-server
          chmod +x vergen-server
      - name: Render the systemd unit
        if: env.SKIP_DEPLOY != '1'
        shell: bash
        env:
          DEPLOY_SERVICE_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          port="${DEPLOY_SERVICE_PORT:-8080}"
          # Loopback bind only: caddy on the host terminates TLS for the
          # public 443 and proxies into 127.0.0.1:$port.
          cat > /tmp/vergen-server.service <<UNIT
          [Unit]
          Description=VergeN ops server
          After=network.target caddy.service

          [Service]
          User=vergen
          ExecStart=/usr/local/bin/vergen-server --db /var/lib/vergen/vergen.db --addr 127.0.0.1:$port --downloads /var/lib/vergen/downloads
          Restart=always
          RestartSec=3
          NoNewPrivileges=true
          ProtectSystem=full
          ProtectHome=true
          PrivateTmp=true

          [Install]
          WantedBy=multi-user.target
          UNIT
      - name: Upload server files
        if: env.SKIP_DEPLOY != '1'
        timeout-minutes: 10
        shell: bash
        run: |
          set -x
          ls -lh vergen-server /tmp/vergen-server.service
          local_hash=$(sha256sum vergen-server | cut -d ' ' -f 1)
          remote_hash=$(ssh -T vergen-target 'if [ -f /usr/local/bin/vergen-server ]; then sha256sum /usr/local/bin/vergen-server; fi' | cut -d ' ' -f 1)
          if [ "$local_hash" = "$remote_hash" ]; then
            echo "Server binary unchanged; skipping upload"
            echo "SERVER_BINARY_CHANGED=false" >> "$GITHUB_ENV"
          else
            # scp hides its progress meter without a local terminal in Actions.
            script -q -e -c 'scp -v -C vergen-server vergen-target:/tmp/vergen-server.new' /dev/null </dev/null
            echo "SERVER_BINARY_CHANGED=true" >> "$GITHUB_ENV"
          fi
          script -q -e -c 'scp -v /tmp/vergen-server.service vergen-target:/tmp/vergen-server.service' /dev/null </dev/null
      - name: Restart ops server
        if: env.SKIP_DEPLOY != '1'
        timeout-minutes: 3
        shell: bash
        run: |
          ssh -T vergen-target "bash -se -- '$SERVER_BINARY_CHANGED'" <<'REMOTE'
          set -x
          id vergen >/dev/null 2>&1 || sudo -n useradd -r -s /usr/sbin/nologin vergen
          if [ "$1" = true ]; then
            sudo -n mv /tmp/vergen-server.new /usr/local/bin/vergen-server
            sudo -n chmod 755 /usr/local/bin/vergen-server
          fi
          sudo -n mkdir -p /var/lib/vergen/downloads
          sudo -n chown vergen:vergen /var/lib/vergen /var/lib/vergen/downloads
          sudo -n chmod 755 /var/lib/vergen/downloads
          for file in /var/lib/vergen/vergen.db{,-wal,-shm}; do
            if [ -e "$file" ]; then
              sudo -n chown vergen:vergen "$file"
            fi
          done
          sudo -n mv /tmp/vergen-server.service /etc/systemd/system/vergen-server.service
          sudo -n systemctl daemon-reload
          sudo -n systemctl enable vergen-server
          sudo -n systemctl restart vergen-server
          REMOTE
      - name: Health check
        if: env.SKIP_DEPLOY != '1'
        timeout-minutes: 5
        shell: bash
        env:
          DEPLOY_SERVICE_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          port="${DEPLOY_SERVICE_PORT:-8080}"
          ssh -T vergen-target "bash -se -- '$port'" <<'REMOTE'
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 5 "http://127.0.0.1:$1/healthz" | grep -q ok; then
              echo "deploy health check ok"
              exit 0
            fi
            sleep 5
          done
          echo "::error::health check failed after deploy"
          exit 1
          REMOTE
