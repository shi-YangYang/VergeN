name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format check (biome)
        run: pnpm format:check
      - name: Lint (eslint)
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: i18n sync check
        run: pnpm i18n:check
      - name: Architecture guard
        run: pnpm arch:check
      - name: Unit tests
        run: pnpm test

  backend:
    name: Rust checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop dependencies (tauri needs libwebkit2gtk to compile)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      # Tauri's build script validates every externalBin path before any
      # rust code compiles; lint/test don't run the sidecars, so empty
      # placeholders satisfy the check (the release workflow downloads
      # real ones).
      - name: Create sidecar placeholders
        run: |
          mkdir -p src-tauri/sidecar
          for name in \
            clash-verge-service \
            clash-verge-service-install \
            clash-verge-service-uninstall \
            verge-mihomo \
            verge-mihomo-alpha; do
            touch "src-tauri/sidecar/$name-x86_64-unknown-linux-gnu"
          done
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test

  server:
    name: Server checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      # The server embeds the admin panel with go:embed all:dist; the
      # panel must be built before any go build.
      - uses: pnpm/action-setup@v4
        with:
          prefix: server/web
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: server/web/pnpm-lock.yaml
      - name: Build the admin panel
        run: pnpm install --frozen-lockfile && pnpm build
        working-directory: server/web
      - name: Build
        run: go build ./...
        working-directory: server
      - name: Vet
        run: go vet ./...
        working-directory: server
      - name: Tests
        run: go test ./...
        working-directory: server
